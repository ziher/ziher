# PostgreSQL. Versions 9.3 and up are supported.
#
# Install the pg driver:
#   gem install pg
# On macOS with Homebrew:
#   gem install pg -- --with-pg-config=/usr/local/bin/pg_config
# On macOS with MacPorts:
#   gem install pg -- --with-pg-config=/opt/local/lib/postgresql84/bin/pg_config
# On Windows:
#   gem install pg
#       Choose the win32 build.
#       Install PostgreSQL and put its /bin directory on your path.
#
# Configure Using Gemfile
# gem "pg"
#
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: ziher_development
  # 127.0.0.1 forces TCP. Compose sets ZIHER_DB_HOST to the postgres service.
  # .inspect quotes the value so passwords that contain special characters stay valid YAML.
  host: <%= ENV.fetch("ZIHER_DB_HOST", "127.0.0.1").inspect %>
  port: <%= ENV.fetch("ZIHER_DB_PORT", 5432) %>
  username: <%= ENV.fetch("ZIHER_DB_USERNAME", "ziher").inspect %>
  password: <%= ENV.fetch("ZIHER_DB_PASSWORD", "ziher").inspect %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: ziher_test
  host: <%= ENV.fetch("ZIHER_DB_HOST", "127.0.0.1").inspect %>
  port: <%= ENV.fetch("ZIHER_DB_PORT", 5432) %>
  username: <%= ENV.fetch("ZIHER_DB_USERNAME", "ziher").inspect %>
  password: <%= ENV.fetch("ZIHER_DB_PASSWORD", "ziher").inspect %>
  min_messages: warning

production:
  <<: *default
  database: <%= ENV.fetch("ZIHER_DB_NAME", "").inspect %>
  host: <%= ENV.fetch("ZIHER_DB_HOST", "").inspect %>
  username: <%= ENV.fetch("ZIHER_DB_USERNAME", "").inspect %>
  password: <%= ENV.fetch("ZIHER_DB_PASSWORD", "").inspect %>
