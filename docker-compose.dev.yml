name: ziher-dev

volumes:
  postgres-data:

services:
  postgres:
    image: postgres:16
    container_name: ziher-dev-postgres
    environment:
      POSTGRES_USER: ziher
      POSTGRES_PASSWORD: ziher
      POSTGRES_DB: ziher_development
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ziher -d ziher_development"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  ziher:
    build:
      context: .
      dockerfile: Dockerfile
      target: ziher-dev
      args:
        SECRET_KEY_BASE: dev_secret_key_base_do_not_use_in_production
    container_name: ziher-dev-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RAILS_ENV: development
      ZIHER_APP_NAME: dev environment
      ZIHER_DB_HOST: postgres
      ZIHER_DB_NAME: ziher_development
      ZIHER_DB_USERNAME: ziher
      ZIHER_DB_PASSWORD: ziher
      SECRET_KEY_BASE: dev_secret_key_base_do_not_use_in_production
      RAILS_MAX_THREADS: 5
      # DEVELOPMENT-ONLY AR Encryption keys — do NOT use these in production
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: epZ21hJzkcLkwoCuPow81NQbFB7WHABj
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: V99Fa3bj1s4KefrAqHMvvOe6ujA8dEQu
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: wKu71XQjyJPqN4rq7p6DkOjEJUuppQzi
    ports:
      - "3000:3000"
    volumes:
      - .:/ziher
    entrypoint: ["/bin/bash", "/ziher/docker/entrypoint-dev-auto.sh"]
    tty: true
    stdin_open: true

  ziher-jobs:
    build:
      context: .
      dockerfile: Dockerfile
      target: ziher-dev
      args:
        SECRET_KEY_BASE: dev_secret_key_base_do_not_use_in_production
    container_name: ziher-dev-jobs
    depends_on:
      postgres:
        condition: service_healthy
      ziher:
        condition: service_started
    environment:
      RAILS_ENV: development
      ZIHER_APP_NAME: dev environment
      ZIHER_DB_HOST: postgres
      ZIHER_DB_NAME: ziher_development
      ZIHER_DB_USERNAME: ziher
      ZIHER_DB_PASSWORD: ziher
      SECRET_KEY_BASE: dev_secret_key_base_do_not_use_in_production
      RAILS_MAX_THREADS: 5
      ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: epZ21hJzkcLkwoCuPow81NQbFB7WHABj
      ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: V99Fa3bj1s4KefrAqHMvvOe6ujA8dEQu
      ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: wKu71XQjyJPqN4rq7p6DkOjEJUuppQzi
    volumes:
      - .:/ziher
    entrypoint: ["/bin/bash", "-lc", "cd /ziher && bundle exec bin/jobs"]
    restart: unless-stopped
