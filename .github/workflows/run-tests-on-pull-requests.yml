name: Test the app on pull requests

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v4

      - name: Build and start ZiHeR
        run: make up CACHE_FROM=type=gha,scope=ziher-dev CACHE_TO=type=gha,scope=ziher-dev,mode=max

      - name: Run tests
        run: make test
